[build-system]
requires = ["uv_build>=0.12.6,<0.13"]
build-backend = "uv_build"

[project]
name = "reko-yt"
version = "0.4.0"
description = "A modern, local-first CLI tool to extract transcripts from YouTube and transform them into concise summaries and key points."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Riccardo Ruspoli", email = "riccardoruspoli@gmail.com" }]
requires-python = ">=3.10,<3.15"
keywords = ["youtube", "summarization", "llm", "cli", "ollama", "transcript"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Video",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "bleach>=6.3,<6.5",
  "dspy>=3.2.1,<3.4.0",
  "fastapi>=0.136.3,<0.142.0",
  "iso639-lang~=2.6.3",
  "jinja2~=3.1.6",
  "markdown~=3.10.2",
  "ollama~=0.6.2",
  "pytubefix>=10.9,<10.12",
  "tiktoken>=0.13,<0.14",
  "tqdm>=4.68.1,<4.71.0",
  "uvicorn>=0.49,<0.53",
  "youtube-transcript-api~=1.2.4",
]

[project.urls]
Homepage = "https://github.com/riccardoruspoli/reko"
Repository = "https://github.com/riccardoruspoli/reko"
Issues = "https://github.com/riccardoruspoli/reko/issues"

[project.scripts]
reko = "reko.__main__:main"

[tool.uv.build-backend]
module-name = "reko"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-rav"

[dependency-groups]
dev = [
  "pytest>=9.0.2,<9.2.0",
  "pytest-cov>=7.0,<7.2",
  "ruff>=0.15.1,<0.17.0",
  "git-cliff~=2.13.1",
]
