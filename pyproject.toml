[build-system]
requires = ["setuptools~=82.0.1", "wheel~=0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reko-yt"
version = "0.1.1"
description = "A modern, local-first CLI tool to extract transcripts from YouTube and transform them into concise summaries and key points."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Riccardo Ruspoli", email = "riccardoruspoli@gmail.com" }]
requires-python = ">=3.10,<3.15"
keywords = ["youtube", "summarization", "llm", "cli", "ollama", "transcript"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Video",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "dspy~=3.2.1",
  "fastapi~=0.136.3",
  "iso639-lang~=2.6.3",
  "jinja2~=3.1.6",
  "markdown~=3.10.2",
  "ollama~=0.6.2",
  "pytubefix~=10.9.0",
  "tqdm~=4.68.1",
  "uvicorn~=0.49.0",
  "youtube-transcript-api~=1.2.4",
]

[project.urls]
Homepage = "https://github.com/riccardoruspoli/reko"
Repository = "https://github.com/riccardoruspoli/reko"
Issues = "https://github.com/riccardoruspoli/reko/issues"

[project.optional-dependencies]
dev = ["ruff", "tox~=4.55.1", "build~=1.5.0", "twine~=6.2.0"]

[project.scripts]
reko = "reko.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reko = ["web/templates/*.html", "web/static/*.js", "web/static/*.css"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
