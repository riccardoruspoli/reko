services:
  reko:
    image: ghcr.io/riccardoruspoli/reko:${REKO_TAG:-latest}
    build:
      context: .
    user: "${REKO_UID:-10001}:${REKO_GID:-10001}"
    ports:
      - "${REKO_PORT:-8000}:8000"
    environment:
      REKO_DATA_DIR: /data
      REKO_MAX_CONCURRENT_JOBS: ${REKO_MAX_CONCURRENT_JOBS:-1}
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
